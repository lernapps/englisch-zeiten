# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Was früher war: used to"
description: "Du liest einen Sachtext über das Überschallflugzeug Concorde. Du erkennst, was früher Gewohnheit war und heute nicht mehr gilt, und bildest Sätze mit used to."
competencies: [used-to]
scope: Die Seite führt used to ein, mit einem Sachtext über die Concorde als Lesestück. Used to erzählt von Gewohnheiten und Zuständen der Vergangenheit, die heute nicht mehr gelten. Auf dem Zeitstrahl ist es eine graue Punktreihe in der Vergangenheit, die vor now endet. Die Form ist used to plus Grundform des Verbs, die Verneinung didn't use to und die Frage Did … use to …? Dazu der Vergleich mit would, das nur für wiederholte Handlungen steht, nicht für Zustände. Nicht hier, weil es andere Seiten sind. Die Wendung be used to (an etwas gewöhnt sein), die Übersicht aller Zeiten, das past perfect progressive.
blocks:
  - type: section
    id: einstieg
    title: Was du schon kennst
    blocks:
      - type: single-choice
        id: used-to-start
        text: Du kennst das simple past, zum Beispiel I played football every Sunday. Was sagt der Satz I used to play football every Sunday zusätzlich?
        options:
          - text: Das ist eine Gewohnheit, die auch heute noch gilt.
            correct: false
            info: Dafür steht das simple present, zum Beispiel I play football every Sunday.
          - text: Das war früher eine Gewohnheit und gilt heute nicht mehr.
            correct: true
            info: Used to nennt eine Gewohnheit der Vergangenheit und zeigt zugleich, dass sie heute vorbei ist.
          - text: Das ist nur ein einziges Mal passiert.
            correct: false
            info: Every Sunday heißt jeden Sonntag. Es geht um viele Sonntage, nicht um einen.
        explanation: Used to ist wie das simple past eine Zeitform der Vergangenheit, sagt aber deutlicher, dass es heute anders ist.
      - type: text
        text: "**Das kannst du danach:** Du erkennst in einem Sachtext, was früher oft so war und heute nicht mehr. Und du bildest dafür Sätze mit used to."
  - type: section
    id: lesestueck
    title: "Sachtext: Die Concorde"
    blocks:
      - type: vocabulary
        caption: Wörter zum Text
        languages: { source: de, target: en }
        entries:
          - target: treaty
            source: Vertrag zwischen Staaten
          - target: passenger plane
            source: Passagierflugzeug
          - target: enter service
            source: in Betrieb gehen
          - target: speed of sound
            source: Schallgeschwindigkeit
          - target: height
            source: Höhe
          - target: carry
            source: befördern, tragen
          - target: customer
            source: Kunde, Käufer
          - target: route
            source: Strecke, Route
          - target: sonic boom
            source: Überschallknall
          - target: be limited to
            source: beschränkt sein auf
          - target: crash
            source: abstürzen
          - target: take-off
            source: Start (Flugzeug)
          - target: on board
            source: an Bord
          - target: deadly
            source: tödlich
          - target: commercial flight
            source: Linienflug
          - target: airline
            source: Fluggesellschaft
          - target: supersonic
            source: schneller als der Schall
          - target: engine
            source: Triebwerk, Motor
          - target: thin
            source: dünn
          - target: narrow
            source: eng, schmal
          - target: ocean
            source: Ozean, Meer
          - target: market
            source: Markt, Absatzgebiet
          - target: accident
            source: Unfall
          - target: bang
            source: Knall
          - target: look up
            source: nach oben schauen
      - type: text
        text: |
          **[1]** Concorde was a passenger plane that France and Britain built together. People started to study the idea in 1954, and the two countries signed a treaty in 1962. Its first flight was on 2 March 1969, and it entered service on 21 January 1976. In the end, only twenty of them were built.

          **[2]** Before Concorde, a flight from Paris to New York used to take about eight hours. Concorde did the same trip in just under three and a half hours, because it flew at about twice the speed of sound. It flew at a height of up to 18,300 metres, where the air is thin. Its four engines pushed it along at about 2,150 kilometres an hour.
      - type: text
        text: |
          **[3]** The plane was narrow inside, and it used to carry between 92 and 128 passengers, depending on the seating. Its main market was the Atlantic. Only two airlines, Air France and British Airways, ever became its customers. Flights to New York began on 17 October 1977.

          **[4]** There was one big problem. A supersonic plane makes a loud bang, the sonic boom. Because of this, Concorde could not fly fast over land, so it was limited to routes over the ocean.
      - type: text
        text: |
          **[5]** On 25 July 2000, a Concorde of Air France crashed shortly after take-off near Paris. All 109 people on board and four people on the ground died. It was the only deadly accident in the history of the plane, and the flights stopped until November 2001.

          **[6]** The last commercial flight was on 24 October 2003, twenty-seven years after the start of the service. Eighteen of the twenty planes now stand in museums in Europe and North America. People who used to look up to see Concorde in the sky must now go to a museum, because no plane of this kind flies today.
  - type: section
    id: neu
    title: Die graue Punktreihe
    blocks:
      - type: text
        text: Beim simple present ist eine Gewohnheit eine Punktreihe, die über now hinausgeht. **Used to** malt die Punktreihe nur in die Vergangenheit. Sie ist **grau** und endet vor now. Was in den Punkten passierte, war oft so, gilt aber heute nicht mehr.
      - type: figure
        image: images/zeitstrahl-used-to.svg
        alt: Ein Zeitstrahl von links nach rechts. Rechts steht ein roter Strich mit now. Links davon liegt eine Reihe grauer Punkte, die weit vor now endet. Über dem Strahl hängt ein Fähnchen mit used to fly, unter dem Strahl steht heute nicht mehr.
        caption: Die Punkte enden vor now. Bei der Concorde ist die Reihe 2003 zu Ende gegangen.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · used to
        header: [Satzart, Form, Beispiel]
        rows:
          - [Aussage, used to + Grundform, The plane used to cross the ocean in less than four hours.]
          - [Verneinung, didn't use to + Grundform, People didn't use to cross the Atlantic in three hours.]
          - [Frage, Did … use to + Grundform …?, Did flights to New York use to take eight hours?]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **used to + Grundform**, für alle Personen gleich. Es heißt „früher“ oder „pflegte zu“ und ist nicht be used to („an etwas gewöhnt sein“). In Verneinung und Frage zeigt **did** schon die Vergangenheit, darum heißt es dort **use to** ohne d (didn't use to, Did you use to …?). Used to passt zu Gewohnheiten und zu Zuständen: He used to be shy, She used to have a dog. **Would** kann dasselbe nur bei wiederholten Handlungen sagen: We would play football every Sunday. Bei Zuständen bleibt es bei used to: We used to be shy, nicht We would be shy.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: used-to-verstehen
        text: Welcher Satz sagt richtig, wie lange ein Flug von Paris nach New York früher ohne Concorde dauerte?
        options:
          - text: A flight from Paris to New York used to take about three and a half hours.
            correct: false
            info: Das ist die Zeit der Concorde, nicht die der normalen Flugzeuge. Die Concorde ist der Vergleich in Zeile 2.
          - text: A flight from Paris to New York used to take about twenty-seven years.
            correct: false
            info: Die 27 Jahre in Zeile 6 sind die Zeit, in der die Concorde im Dienst war, keine Flugzeit.
          - text: A flight from Paris to New York used to take about eight hours.
            correct: true
            info: Das steht in Zeile 2. Normale Flugzeuge brauchten etwa acht Stunden.
        explanation: Zeile 2 nennt acht Stunden für normale Flugzeuge und knapp dreieinhalb für die Concorde.
        links:
          - title: Concorde (Wikipedia, englisch)
            url: https://en.wikipedia.org/wiki/Concorde
      - type: multiple-choice
        id: used-to-zeilen
        text: In welchen Zeilen steht used to?
        options:
          - text: Zeile 1
            correct: false
            info: Zeile 1 steht im simple past (was, entered), ohne used to.
          - text: Zeile 2
            correct: true
            info: Ein Flug used to take acht Stunden, das war früher so.
          - text: Zeile 3
            correct: true
            info: Die Concorde used to carry zwischen 92 und 128 Passagiere, das war früher so.
          - text: Zeile 4
            correct: false
            info: Zeile 4 erklärt, warum die Concorde nur über dem Meer schnell fliegen konnte. Used to steht dort nicht.
          - text: Zeile 5
            correct: false
            info: Zeile 5 erzählt einen einzelnen Unfall im simple past. Eine Gewohnheit ist das nicht.
          - text: Zeile 6
            correct: true
            info: People used to look up beschreibt eine frühere Gewohnheit, die heute nicht mehr geht.
        explanation: In den Zeilen 2, 3 und 6 steht used to.
        links:
          - title: Concorde (Wikipedia, englisch)
            url: https://en.wikipedia.org/wiki/Concorde
      - type: true-false
        id: used-to-wahr
        text: "Der Satz „Concorde used to fly to New York“ sagt: Concorde fliegt auch heute noch nach New York."
        answer: false
        hint: Wo endet die graue Punktreihe?
        explanation: Die graue Punktreihe endet vor now. Used to sagt, dass es früher so war und heute nicht mehr.
      - type: language-task
        id: used-to-form
        languages: { source: de, target: en }
        mode: choice
        task: Wähle die richtige Form.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Früher dauerte ein Flug acht Stunden.
            target: Flights [used to] take eight hours.
            distractors: [[use to, are used to]]
          - cue: Früher flogen die Menschen nicht in drei Stunden über den Atlantik.
            target: People [didn't use to] cross the Atlantic in three hours.
            distractors: [[didn't used to, doesn't use to]]
          - cue: Flogen sie früher von Paris nach New York?
            target: "[Did] they use to fly from Paris to New York?"
            distractors: [[Do, Were]]
          - cue: Die Concorde war früher das schnellste Passagierflugzeug.
            target: Concorde [used to] be the fastest passenger plane.
            distractors: [[use to, was use to]]
        hint: In der Aussage heißt es used to. Nach did und didn't heißt es use to ohne d.
      - type: language-task
        id: used-to-bilden
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz mit used to.
        form: { case: hint, punctuation: ok }
        items:
          - cue: my grandfather · play football · on Sundays
            target: My grandfather used to play football on (Sundays|Sunday).
            mistakes:
              - answer: My grandfather used to played football on Sundays.
                message: Nach used to steht die Grundform des Verbs, also play.
              - answer: My grandfather use to play football on Sundays.
                message: In der Aussage heißt es used to mit d.
              - answer: My grandfather plays football on Sundays.
                message: Das simple present nennt eine Gewohnheit von heute. Du willst eine frühere Gewohnheit, darum used to.
          - cue: we · not · live in London
            target: We (didn't use to|did not use to|never used to) live in London.
            mistakes:
              - answer: We didn't used to live in London.
                message: Nach didn't zeigt did schon die Vergangenheit, darum use to ohne d.
              - answer: We not used to live in London.
                message: Für die Verneinung brauchst du didn't, nicht not allein.
              - answer: We did not used to live in London.
                message: Nach did not zeigt did schon die Vergangenheit, darum use to ohne d.
              - answer: We used to not live in London.
                message: Das klingt ungewöhnlich. Sag didn't use to.
          - cue: Concorde · fly · to Washington
            target: Concorde used to fly to Washington.
            mistakes:
              - answer: Concorde used to flew to Washington.
                message: Nach used to steht die Grundform, also fly.
              - answer: Concorde use to fly to Washington.
                message: In der Aussage heißt es used to mit d.
              - answer: Concorde would fly to Washington.
                message: Would passt nur zu Handlungen, die sich oft wiederholten. Hier ist used to gefragt.
          - cue: you · walk to school · Frage
            target: Did you use to walk to school?
            mistakes:
              - answer: Did you used to walk to school?
                message: Nach Did heißt es use to ohne d.
              - answer: You use to walk to school?
                message: Für die Frage brauchst du Did am Anfang und use to ohne d.
              - answer: Do you use to walk to school?
                message: Es geht um früher, darum brauchst du Did, nicht Do.
        hint: Frag dich, ob es früher so war und heute nicht mehr. Dann kommt used to vor die Grundform des Verbs.
      - type: single-choice
        id: used-to-entscheidung
        text: Peter spielte als Kind jeden Samstag Tennis, heute spielt er nicht mehr. Welcher Satz sagt das?
        options:
          - text: Peter plays tennis every Saturday.
            correct: false
            info: Das simple present nennt eine Gewohnheit von heute.
          - text: Peter used to play tennis on Saturdays.
            correct: true
            info: Used to sagt, dass es früher eine Gewohnheit war und heute nicht mehr gilt.
          - text: Peter is playing tennis every Saturday.
            correct: false
            info: Das present progressive sagt, was gerade passiert. Eine Gewohnheit der Vergangenheit sagt es nicht.
        explanation: Die graue Punktreihe endet vor now, darum used to play.
      - type: language-task
        id: used-to-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz steckt ein Fehler. Schreibe den Satz richtig.
        form: { case: hint, punctuation: ok }
        items:
          - cue: People didn't used to cross the Atlantic in three hours.
            target: People (didn't|did not) use to cross the Atlantic in three hours.
            mistakes:
              - answer: People didn't used to cross the Atlantic in three hours.
                message: Noch nicht ganz. Nach didn't steht use ohne d.
              - answer: People did not used to cross the Atlantic in three hours.
                message: Noch nicht ganz. Nach did not steht use ohne d.
          - cue: Did Concorde used to land at Heathrow?
            target: Did Concorde use to land at Heathrow?
            mistakes:
              - answer: Did Concorde used to land at Heathrow?
                message: Noch nicht ganz. Nach Did steht use ohne d.
        hint: Nach did und didn't steht use to ohne d.
      - type: language-task
        id: used-to-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: we-used-to-play-football-every-sunday.mp3
            target: We used to play football every Sunday.
          - audio: my-brother-didnt-use-to-eat-fish.mp3
            target: My brother didn't use to eat fish.
          - audio: did-your-grandmother-use-to-sing.mp3
            target: Did your grandmother use to sing?
  - type: section
    id: anwenden
    title: Selbst sprechen und schreiben
    blocks:
      - type: speaking-task
        id: used-to-nachsprechen
        language: en
        items:
          - audio: concorde-used-to-fly-very-fast.mp3
            text: Concorde used to fly very fast.
          - audio: people-used-to-write-long-letters.mp3
            text: People used to write long letters.
          - audio: i-didnt-use-to-like-tea.mp3
            text: I didn't use to like tea.
        hint: Hör den Satz zuerst. Sprich langsam nach und achte auf used to und use to.
      - type: open-task
        id: used-to-frueher
        task: "Schreibe drei bis vier Sätze darüber, was du früher oft getan hast und heute nicht mehr tust, zum Beispiel als Kind oder in der Grundschule. Schreibe auch einen Satz, was du früher nicht getan hast."
        points:
          - text: Mindestens zwei Sätze mit used to und der Grundform des Verbs.
            source: /ueberblick/used-to/#neu
          - text: Ein Satz mit didn't use to für etwas, das früher nicht so war.
            source: /ueberblick/used-to/#neu
          - text: Ganze Sätze mit Verb und Punkt am Ende.
            kind: form
        solution: |
          I used to play with toy cars every day. I used to be afraid of dogs. I didn't use to eat cabbage.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Am Zeitstrahl hängt jetzt eine graue Punktreihe, die vor now endet. Auf der nächsten Seite kommen alle Zeichen zusammen auf einen Strahl und du wählst die richtige Zeitform für jede Situation.
