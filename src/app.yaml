# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: englisch/grammatik
title: Zeiten auf dem Zeitstrahl
intro: "In der Millbrook School hängt Mr Hill einen Zeitstrahl an die Wand. Sophie, Ellie, Peter und Amir hängen Karten darauf. Du lernst, welche englische Zeitform du wofür brauchst und wie du sie bildest: für Gewohnheiten, für das, was gerade passiert, für Vergangenes, für Pläne und, in den späteren Kapiteln, für das Erzählen, für Dauer und für genaue Zeitpunkte."
languages: [de]
scope:
  text: Die App erklärt die englischen Zeitformen auf einem Zeitstrahl für Kinder im ersten bis vierten Lernjahr (Stufe 5-6 und 7-8). Jede Zeitform hat ein festes Zeichen, ein Signalwort und eine Bau-Karte. Gelernt werden to be, have got, simple present, Häufigkeitswörter, present progressive, simple past, unregelmäßige Verben, present perfect, will und going to, dazu past progressive, past perfect, Zeitenfolge, present perfect progressive, Zustandsverben und Zeiten für Pläne und Zeitpunkte der Zukunft. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Fragen und Verneinung mit do und did (steht im Explainer „Sätze bauen“)
    - Bedingungssätze und indirekte Rede
    - Passiv
    - Aussprache von -s und -ed
    - Zeiten für Klasse 9 und 10 (alle Zeiten im Überblick, past perfect progressive, used to und would)
chapters: [immer-oder-jetzt, gestern-und-schon, morgen-und-spaeter, erzaehlen, dauer, plaene]
