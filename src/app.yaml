format: 2
strand: englisch/grammatik
title: Zeiten auf dem Zeitstrahl
intro: In der Millbrook School hängt Mr Hill einen Zeitstrahl an die Wand. Sophie, Ellie, Peter und Amir hängen Karten darauf. Du lernst, welche englische Zeitform du für Gewohnheiten, für das, was gerade passiert, für Vergangenes und für Pläne brauchst, und wie du sie bildest.
languages: [de]
scope:
  text: Die App erklärt die englischen Zeitformen auf einem Zeitstrahl für Kinder im ersten und zweiten Lernjahr. Jede Zeitform hat ein festes Zeichen, ein Signalwort und eine Bau-Karte. Gelernt werden to be, have got, simple present, Häufigkeitswörter, present progressive, simple past, unregelmäßige Verben, present perfect, will und going to. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir.
  out:
    - Fragen und Verneinung mit do und did (steht im Explainer „Sätze bauen“)
    - Bedingungssätze und indirekte Rede
    - Passiv
    - Aussprache von -s und -ed
    - Zeiten für Klasse 7 bis 10 (Erzählen, since und for, Zukunft mit Plänen, used to)
chapters: [immer-oder-jetzt, morgen-und-spaeter]
