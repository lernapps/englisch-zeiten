# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Was hast du? have got und has got"
description: "Ellie, Peter und Amir zeigen, was sie haben. Du lernst have got und has got für Aussagen, Verneinungen und Fragen."
competencies: [have-got]
scope: "Die Seite führt have got und has got ein. Es sagt, was jemand hat. Bei I, you, we und they steht have got, bei he, she und it steht has got. Die Verneinung ist haven't got oder hasn't got, die Frage entsteht, indem have oder has und die Person die Plätze tauschen (Have you got a pen? Has Ellie got a dog?). Dazu die Kurzformen I've got und she's got. Bei have got steht kein do. Nicht hier, weil es spätere Seiten sind. Das Verb be, das simple present, Fragen und Verneinung mit do."
blocks:
  - type: section
    id: einstieg
    title: Wer hat was?
    blocks:
      - type: figure
        image: images/szene-have-got.svg
        alt: Sophie, Ellie, Amir und Peter stehen im Klassenzimmer. Ellie steht neben einem braunen Hund. Auf dem Boden liegen eine rote Federtasche und ein blauer Stift.
        caption: Rechts steht Ellies Hund.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Ellie hat einen Hund (dog). Peter hat einen Stift (pen). Mr Hill fragt: „Wer hat was?“ Wenn du sagst, was jemand hat, brauchst du auf Englisch **have got**."
      - type: single-choice
        id: have-got-start
        text: Welcher Satz sagt, dass Peter einen Stift hat?
        options:
          - text: Peter has got a pen.
            correct: true
            info: Peter ist „er“, und zu he gehört has got.
          - text: Peter have got a pen.
            correct: false
            info: have got gehört zu I, you, we und they. Bei Peter fehlt das s.
          - text: Peter is got a pen.
            correct: false
            info: is gehört zum Verb be und sagt, wie jemand ist, nicht, was er hat.
        explanation: Was jemand hat, sagst du mit have got. Bei he, she und it heißt es has got.
      - type: text
        text: "**Das kannst du danach:** Du sagst auf Englisch, was jemand hat, und du verneinst und fragst mit have got."
  - type: section
    id: neu
    title: have got, has got und die Fragen
    blocks:
      - type: text
        text: Mit **have got** sagst du, was du oder jemand anderes hat. Bei he, she und it wird daraus **has got**.
      - type: table
        caption: Klassenzimmer-Poster · have got und has got
        header: [Person, Form, Beispiel]
        rows:
          - [I, have got, I have got a pen.]
          - [you, have got, You have got a bag.]
          - [he / she / it, has got, Ellie has got a dog.]
          - [we, have got, We have got a book.]
          - [they, have got, They have got a bike.]
      - type: table
        caption: Klassenzimmer-Poster · Aussage, Verneinung, Frage
        header: [Aussage, Verneinung, Frage]
        rows:
          - [Ellie has got a dog., Ellie hasn't got a dog. / Ellie has not got a dog., Has Ellie got a dog?]
          - [We have got a bike., We haven't got a bike. / We have not got a bike., Have we got a bike?]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **He, she, it – das s muss mit:** has got statt have got. Die **Verneinung** hängt not hinter have oder has und wird kurz zu **haven't** und **hasn't**. Die **Frage** entsteht, wenn have oder has und die Person die Plätze tauschen. Bei have got brauchst du kein do. Kurz sagst du auch **I've got** und **she's got**.
      - type: vocabulary
        caption: Klassenzimmer-Poster · Wörter dieser Seite
        languages: { source: de, target: en }
        entries:
          - target: have got
            source: haben
          - target: bike
            source: Fahrrad
          - target: pencil case
            source: Federtasche
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: language-task
        id: have-got-form
        languages: { source: de, target: en }
        mode: choice
        task: Wähle have oder has.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ich habe ein Telefon.
            target: I [have] got a phone.
            distractors: [[has, am]]
          - cue: Sophie hat einen Bruder.
            target: Sophie [has] got a brother.
            distractors: [[have, is]]
          - cue: Amir und Peter haben ein Fahrrad.
            target: Amir and Peter [have] got a bike.
            distractors: [[has, are]]
          - cue: Amir hat eine Federtasche.
            target: Amir [has] got a pencil case.
            distractors: [[have, is]]
        hint: Schau, wer etwas hat. Nur he, she und it bekommen has.
      - type: ordering
        id: have-got-reihenfolge
        text: Bringe die Wörter in die richtige Reihenfolge, so dass ein Satz entsteht.
        items: [Amir, has, got, a, bag]
        explanation: Zuerst kommt die Person, dann has got, dann das, was sie hat.
        hint: Der Satz beginnt mit der Person. Danach kommt die Form von have got.
      - type: single-choice
        id: have-got-verneinung
        text: Mr Hill hat kein Auto. Welcher Satz sagt das richtig?
        options:
          - text: Mr Hill hasn't got a car.
            correct: true
            info: Bei he, she und it gehört hasn't hinter die Person, danach got.
          - text: Mr Hill haven't got a car.
            correct: false
            info: Haven't gehört zu I, you, we und they. Zu Mr Hill passt hasn't.
          - text: Mr Hill doesn't got a car.
            correct: false
            info: Bei have got brauchst du kein do. Die Verneinung hängt nicht an do, sondern an has.
        explanation: Die Verneinung hängt not oder n't an have oder has.
        hint: Mr Hill ist „er“. Dann brauchst du has, nicht have.
      - type: language-task
        id: have-got-frage
        languages: { source: de, target: en }
        task: Schreibe die Frage.
        form: { case: hint, punctuation: ok }
        items:
          - cue: you · a phone
            target: Have you got a phone?
            mistakes:
              - answer: Do you have got a phone?
                message: Bei have got brauchst du kein do. Tausche have und you.
              - answer: You have got a phone?
                message: In der Frage tauschen have und die Person die Plätze.
          - cue: Sophie · a bag
            target: Has Sophie got a bag?
            mistakes:
              - answer: Have Sophie got a bag?
                message: "He, she, it – das s muss mit. Sophie ist „sie“, also has."
          - cue: they · a book
            target: Have they got a book?
            mistakes:
              - answer: Do they have got a book?
                message: Bei have got brauchst du kein do. Tausche have und they.
          - cue: Amir · a sister
            target: Has Amir got a sister?
            mistakes:
              - answer: Have Amir got a sister?
                message: "Amir ist „er“, also has statt have."
        hint: have oder has kommt an den Anfang, danach die Person, dann got.
      - type: language-task
        id: have-got-verneinen
        languages: { source: de, target: en }
        task: Schreibe den Satz auf Englisch.
        form: { case: hint, punctuation: ok }
        items:
          - source: Amir hat keinen Stift.
            target: Amir (hasn't|has not) got a pen.
            mistakes:
              - answer: Amir haven't got a pen.
                message: "Amir ist „er“. He, she, it – das s muss mit: hasn't."
              - answer: Amir doesn't got a pen.
                message: Mit got brauchst du kein do. Nimm hasn't got.
          - source: Wir haben kein Telefon.
            target: We (haven't|have not) got a phone.
            mistakes:
              - answer: We hasn't got a phone.
                message: Zu we gehört have, nicht has.
          - source: Amir hat keine Schwester.
            target: Amir (hasn't|has not) got a sister.
            mistakes:
              - answer: Amir haven't got a sister.
                message: "Amir ist „er“, also hasn't got."
        hint: not hängt hinter have oder has, vor got.
      - type: language-task
        id: have-got-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: sophie-has-got-a-red-jacket.mp3
            target: Sophie has got a red jacket.
          - audio: has-mr-hill-got-any-children.mp3
            target: Has Mr Hill got any children?
          - audio: they-have-got-a-very-old-house.mp3
            target: They have got a very old house.
  - type: section
    id: anwenden
    title: Selbst sagen und schreiben
    blocks:
      - type: speaking-task
        id: have-got-nachsprechen
        language: en
        items:
          - audio: i-have-got-a-big-family.mp3
            text: I have got a big family.
          - audio: she-has-got-a-bike.mp3
            text: She has got a bike.
          - audio: he-has-not-got-a-phone.mp3
            text: He has not got a phone.
        hint: Hör den Satz zuerst. Sprich dann langsam nach und achte auf have und has.
      - type: open-task
        id: have-got-karte
        task: "Mr Hill sammelt, was die Kinder haben. Schreibe zwei Sätze mit have got oder has got: einen über dich und einen über Ellie, Peter oder Amir."
        points:
          - text: Der Satz über dich hat have got, der Satz über eine andere Person has got.
            source: /immer-oder-jetzt/have-got/#neu
          - text: In beiden Sätzen steht, was die Person hat, zum Beispiel a pen, a dog oder a bike.
            source: /immer-oder-jetzt/have-got/#neu
          - text: Es sind ganze Sätze mit Punkt am Ende.
            kind: form
        solution: |
          I have got a book. Ellie has got a dog.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Mr Hill hat notiert, wer was hat. Jetzt will er wissen, was die Kinder in ihrer Freizeit tun. Auf der nächsten Seite hängt Peter eine Punktreihe an den Zeitstrahl.
