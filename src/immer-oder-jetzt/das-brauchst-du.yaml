# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Die englischen Pronomen noch einmal kurz, bevor Mr Hill den Zeitstrahl aufhängt.
recap: englisch/personalpronomen
scope: Die Seite wiederholt nur die Personalpronomen als Subjekt (I, you, he, she, it, we, they) und zeigt den leeren Zeitstrahl, an dem die Zeichen der nächsten Seiten hängen. Links liegt das Frühere, rechts das Spätere, in der Mitte steht now. Neue Inhalte gibt es nicht, auch keine Übung.
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Kannst du das schon? **Ich kann die Personalpronomen als Subjekt (I, he, they) und als Objekt (me, him, them) richtig verwenden.** Das ist der Baustein „Personalpronomen“. Du brauchst ihn gleich bei jedem Verb: Es kommt darauf an, ob jemand „ich“, „er“ oder „sie“ ist. Lies die Tabelle und prüfe in Gedanken, ob du alle Wörter kennst."
      - type: table
        caption: Klassenzimmer-Poster · Die Pronomen
        header: [Pronomen, Bedeutung]
        rows:
          - [I, ich]
          - [you, du / ihr]
          - [he, er]
          - [she, sie (eine Person)]
          - [it, es]
          - [we, wir]
          - [they, sie (mehrere)]
      - type: text
        text: Nicht sicher? Wiederhole es auf der [Seite zu den Personalpronomen](https://lernapps.net/apps/map/englisch/c/personalpronomen/) der Lernlandkarte.
  - type: section
    id: strahl
    title: Der leere Zeitstrahl
    blocks:
      - type: text
        text: "Mr Hill hängt in der Millbrook School einen langen Streifen an die Wand. Das ist der **Zeitstrahl**. Links liegt das, was früher war, rechts das, was später kommt. In der Mitte steht **now**, das heißt „jetzt“."
      - type: figure
        image: images/zeitstrahl-leer.svg
        alt: Ein Zeitstrahl von links nach rechts. Links steht früher, rechts später, in der Mitte steht ein roter Strich mit now. Sonst ist der Strahl leer.
        caption: Der Strahl ist noch leer. Links früher, rechts später, in der Mitte now.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: Sophie, Ellie, Peter und Amir hängen jetzt Karten auf. Jede englische Zeitform bekommt dabei ein eigenes Zeichen. Die Zeichen lernst du Seite für Seite kennen.
