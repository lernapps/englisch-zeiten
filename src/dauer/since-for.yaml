# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Seit wann und wie lange: since und for"
description: "Du erkennst in einer Umfrage, was ein Startpunkt und was eine Länge ist, und sagst mit since und for, wie lange etwas schon dauert."
competencies: [since-for]
scope: Die Seite führt since und for mit dem present perfect ein, mit einem Lesestück als Umfrage der Schülerzeitung. Since nennt den Startpunkt (ein Zeitpunkt, since Tuesday), for nennt die Länge (ein Zeitraum, for three days). Auf dem Zeitstrahl ist es der Bogen des present perfect von einem Startpunkt bis now, mit dem Fähnchen since am Anfang und einer Klammer for über der Länge. Die Form ist have oder has plus die 3. Form des Verbs. Mit since und for steht das present perfect, nicht das simple present. Dazu die Frage How long have you …? Nicht hier, weil es spätere Seiten sind. Das present perfect progressive und die Zustandsverben, die keine Verlaufsform bilden. Verneinung und Fragen mit do und did gehören nicht dazu.
blocks:
  - type: section
    id: einstieg
    title: Wie lange schon?
    blocks:
      - type: single-choice
        id: since-for-start
        text: Du kennst vom Zeitstrahl den Bogen des present perfect. Wo endet dieser Bogen?
        options:
          - text: Bei now
            correct: true
            info: Der Bogen reicht von früher bis now. Das Ergebnis oder die Dauer zählt jetzt.
          - text: Bei einem Punkt in der Vergangenheit
            correct: false
            info: Dort endet der Punkt des simple past, der einzelne Ereignisse zeigt.
          - text: Bei einem Punkt in der Zukunft
            correct: false
            info: Die Zukunft liegt rechts von now. Der Bogen des present perfect reicht nicht dorthin.
        explanation: Der Bogen endet bei now. Neu ist heute, wie du den Anfang und die Länge des Bogens sagst.
      - type: text
        text: "**Das kannst du danach:** Du erkennst, was ein Startpunkt und was eine Länge ist. Und du sagst mit since und for, wie lange etwas schon dauert."
  - type: section
    id: lesestueck
    title: Die Umfrage der Schülerzeitung
    blocks:
      - type: vocabulary
        caption: Wörter zur Umfrage
        languages: { source: de, target: en }
        entries:
          - target: newspaper
            source: Zeitung
          - target: everyone
            source: alle, jeder
          - target: drums
            source: Schlagzeug
          - target: band
            source: Band
          - target: coach
            source: Trainer / Trainerin
          - target: whole
            source: ganz
          - target: grandmother
            source: Großmutter
          - target: shop
            source: Laden
      - type: text
        text: |
          **[1]** **Sophie:** For our school newspaper I am asking everyone the same question: How long have you been here?

          **[2]** **Mr Hill:** I have worked at Millbrook School for twenty years. I have never wanted another job.

          **[3]** **Ellie:** I have been a student here since I was eleven. I have played the drums in the school band since then, too.
      - type: text
        text: |
          **[4]** **Peter:** I have been in the football team since September. I have known our coach for only three weeks, but he is great!

          **[5]** **Amir:** I have lived in this town all my life. My grandmother has had a small shop here for forty years, and I help her every Saturday.

          **[6]** **Sophie:** And me? I have lived here since I came to England. I have been here for two years now, and I have learned a lot.

          **[7]** **Mr Hill:** Good work, Sophie. The newspaper will print all your answers on Friday. Please bring your notes to the classroom after lunch.

          **[8]** **Sophie:** I will! I have written everything on my phone, and I have taken a photo of the whole team, too.
  - type: section
    id: neu
    title: Startpunkt und Länge
    blocks:
      - type: text
        text: Der Bogen des present perfect beginnt irgendwo in der Vergangenheit und endet bei now. Mit **since** sagst du, wo er beginnt, also den **Startpunkt**. Mit **for** sagst du, wie lang er ist, also die **Länge**.
      - type: figure
        image: images/zeitstrahl-since-for.svg
        alt: Ein Zeitstrahl von links nach rechts. Rechts steht ein roter Strich mit now. Ein grüner Bogen reicht von einem blauen Punkt links bis zu now. Am Punkt hängt das Fähnchen since Tuesday. Unter dem Bogen zeigt eine Klammer mit for 3 days die ganze Länge.
        caption: Das Fähnchen since zeigt auf den Startpunkt. Die Klammer for misst den ganzen Bogen.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · since und for
        header: [Wort, Du sagst, Beispiel]
        rows:
          - [since, einen Zeitpunkt (Startpunkt), She has been ill since Tuesday.]
          - [for, einen Zeitraum (Länge), She has been ill for three days.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **have / has + 3. Form + since oder for.** Nach **since** steht ein Zeitpunkt (since breakfast, since last summer) oder ein Satz im simple past (since I was eleven). Nach **for** steht ein Zeitraum (for ten minutes, for a year). Mit since und for brauchst du das present perfect, nicht das simple present: **She has worked here since Tuesday** ist richtig, **She works here since Tuesday** ist falsch.

              Die Frage heißt **How long have you …?** Beispiele: Dad has driven the same car for six years. We have had a cat since March.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: since-for-verstehen
        text: "Die Schülerzeitung fragt Peter nach dem Fußballteam. Seit wann ist er dabei?"
        options:
          - text: Seit September
            correct: true
            info: Peter nennt einen Startpunkt, since September. Der Bogen beginnt im September.
          - text: Seit drei Wochen
            correct: false
            info: Drei Wochen kennt Peter seinen Trainer, nicht das Team. Das steht in derselben Zeile, ist aber eine andere Angabe.
          - text: Seit zwanzig Jahren
            correct: false
            info: Zwanzig Jahre arbeitet Mr Hill an der Schule. Das sagt nicht Peter.
        explanation: Since September ist der Startpunkt, und for three weeks ist die Länge einer anderen Sache.
        links:
          - title: Present perfect (Wikipedia)
            url: https://en.wikipedia.org/wiki/Present_perfect
      - type: multiple-choice
        id: since-for-zeilen
        text: "In welchen Zeilen steht ein Satz mit since?"
        options:
          - text: Zeile 3
            correct: true
            info: In Zeile 3 steht since I was eleven.
          - text: Zeile 6
            correct: true
            info: In Zeile 6 steht since I came to England.
          - text: Zeile 2
            correct: false
            info: In Zeile 2 steht for twenty years, also die Länge und kein Startpunkt.
          - text: Zeile 5
            correct: false
            info: In Zeile 5 steht nur for, nicht since.
        explanation: Since steht, wenn jemand den Startpunkt nennt. For nennt die Länge.
        links:
          - title: Present perfect (Wikipedia)
            url: https://en.wikipedia.org/wiki/Present_perfect
      - type: language-task
        id: since-for-wahl
        languages: { source: de, target: en }
        mode: choice
        task: Wähle since oder for.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ich bin seit acht Uhr hungrig.
            target: I have been hungry [since] eight o'clock.
            distractors: [[for, from]]
          - cue: Er spielt seit zwei Wochen Gitarre.
            target: He has played the guitar [for] two weeks.
            distractors: [[since, from]]
          - cue: Wir kennen uns seit letztem Freitag.
            target: We have known each other [since] last Friday.
            distractors: [[for, from]]
          - cue: Ich warte hier seit einer Stunde.
            target: I have waited here [for] an hour.
            distractors: [[since, from]]
        hint: Ein Zeitpunkt ist ein Startpunkt, ein Zeitraum ist eine Länge.
      - type: language-task
        id: since-for-bilden
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz im present perfect.
        form: { case: hint, punctuation: ok }
        items:
          - cue: she · be · ill · since Monday
            target: She has been ill since Monday.
            mistakes:
              - answer: She is ill since Monday.
                message: Der Bogen beginnt am Montag und reicht bis now. Dafür brauchst du das present perfect, nicht das simple present.
              - answer: She was ill since Monday.
                message: Die Krankheit dauert bis jetzt. Dann ist es der Bogen des present perfect, nicht der Punkt des simple past.
              - answer: She have been ill since Monday.
                message: She gehört zu has, nicht zu have.
          - cue: we · live · here · for ten years
            target: We have lived here for ten years.
            mistakes:
              - answer: We live here for ten years.
                message: Das present perfect zeigt den Bogen bis now. Du brauchst have und die 3. Form.
              - answer: We have live here for ten years.
                message: Nach have kommt die 3. Form, hier lived.
          - cue: Peter · play · tennis · since June
            target: Peter has played tennis since June.
            mistakes:
              - answer: Peter plays tennis since June.
                message: Bei since brauchst du has und die 3. Form, nicht das simple present.
              - answer: Peter have played tennis since June.
                message: Peter gehört zu has.
          - cue: I · know · her · for a year
            target: I have known her for a year.
            mistakes:
              - answer: I know her for a year.
                message: For und die Länge brauchen das present perfect. Know hat die 3. Form known.
              - answer: I have knew her for a year.
                message: Nach have kommt die 3. Form, hier known.
        hint: Frag dich, ob der Bogen bis jetzt reicht. Dann brauchst du have oder has und die 3. Form.
      - type: language-task
        id: since-for-frage
        languages: { source: de, target: en }
        task: Schreibe die Frage mit How long.
        form: { case: hint, punctuation: ok }
        items:
          - cue: you · know · Mr Hill
            target: How long have you known Mr Hill?
            mistakes:
              - answer: How long do you know Mr Hill?
                message: Die Frage nach der Dauer bis jetzt braucht das present perfect. Das heißt have you known.
              - answer: How long you have known Mr Hill?
                message: In der Frage tauschen have und you die Plätze.
          - cue: he · have · his bike
            target: How long has he had his bike?
            mistakes:
              - answer: How long have he had his bike?
                message: He gehört zu has.
              - answer: How long has he have his bike?
                message: Nach has kommt die 3. Form, hier had.
        hint: Die Frage beginnt mit How long, dann have oder has, dann die Person und die 3. Form.
      - type: language-task
        id: since-for-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz steckt ein Fehler. Schreibe den Satz richtig.
        form: { case: hint, punctuation: ok }
        items:
          - cue: She lives here since last summer.
            target: She has lived here since last summer.
            mistakes:
              - answer: She lives here since last summer.
                message: Noch nicht ganz. Since und der Startpunkt brauchen das present perfect.
          - cue: We have been friends since two years.
            target: We have been friends for two years.
            mistakes:
              - answer: We have been friends since two years.
                message: Noch nicht ganz. Two years ist eine Länge, nach der Länge steht for.
        hint: Prüfe zuerst die Zeitform, dann since oder for.
      - type: language-task
        id: since-for-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: our-teacher-has-been-ill-for-a-week.mp3
            target: Our teacher has been ill for a week.
          - audio: i-have-wanted-a-dog-since-my-last-birthday.mp3
            target: I have wanted a dog since my last birthday.
          - audio: my-brother-has-played-the-piano-for-six-months.mp3
            target: My brother has played the piano for six months.
  - type: section
    id: anwenden
    title: Selbst sprechen und schreiben
    blocks:
      - type: speaking-task
        id: since-for-nachsprechen
        language: en
        items:
          - audio: how-long-has-your-sister-worked-in-the-shop.mp3
            text: How long has your sister worked in the shop?
          - audio: they-have-been-in-london-for-three-days.mp3
            text: They have been in London for three days.
          - audio: i-have-not-seen-him-since-the-party.mp3
            text: I have not seen him since the party.
        hint: Hör den Satz zuerst. Sprich langsam nach und achte auf have und has.
      - type: open-task
        id: since-for-umfrage
        task: "Schreibe drei Sätze für die Schülerzeitung über dich oder eine Person, die du kennst: Wie lange tut sie etwas schon? Benutze einmal since und einmal for."
        points:
          - text: Mindestens ein Satz mit since und einem Zeitpunkt.
            source: /dauer/since-for/#neu
          - text: Mindestens ein Satz mit for und einem Zeitraum.
            source: /dauer/since-for/#neu
          - text: Die Sätze stehen im present perfect (have oder has und die 3. Form).
            source: /dauer/since-for/#neu
          - text: Ganze Sätze mit Verb und Punkt am Ende.
            kind: form
        solution: |
          My cousin has lived in Spain since 2020. She has worked in a restaurant for a year. I have known her since I was six.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Am Wandbild hängt jetzt ein Bogen mit dem Fähnchen since und der Klammer for. Auf der nächsten Seite wird aus dem Bogen eine Welle.
