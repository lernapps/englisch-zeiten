# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Verben ohne Welle: Zustandsverben"
description: "Sophie und Amir reden über einen Film. Du erkennst Verben wie know, like und belong, die einen Zustand beschreiben und meistens keine Verlaufsform bilden."
competencies: [dynamic-stative]
scope: "Die Seite führt die Zustandsverben ein, mit einem Lesestück als Dialog von Sophie und Amir nach dem Kino. Zustandsverben beschreiben einen Zustand wie Wissen, Meinung, Gefühl, Wunsch und Besitz (know, understand, believe, remember, like, love, hate, want, need, prefer, belong, own) und bilden meist keine Verlaufsform. Auf dem Zeitstrahl endet die Welle an einem Stoppschild. Dagegen stehen Tätigkeitsverben (read, play, make) in der Verlaufsform, wenn etwas gerade läuft. Wie bei since und for steht auch das present perfect einfach (I have known him for years). Think ist eine Tätigkeit (nachdenken: I am thinking about it) oder ein Zustand (meinen: I think it is good). Nicht hier, weil es spätere Seiten sind. Alle Zeiten der Zukunft. Verneinung und Fragen mit do und did gehören nicht dazu."
blocks:
  - type: section
    id: einstieg
    title: Nach dem Kino
    blocks:
      - type: text
        text: Sophie und Amir haben einen Film gesehen und reden darüber. Du kennst die Welle für etwas, das gerade läuft. Heute siehst du, bei welchen Verben die Welle nicht passt.
      - type: single-choice
        id: dynamic-stative-start
        text: Du kennst die Verlaufsform mit be und -ing. Was zeigt die Welle auf dem Zeitstrahl?
        options:
          - text: Eine Tätigkeit, die gerade läuft.
            correct: true
            info: Die Welle zeigt etwas, das im Gang ist, zum Beispiel I am reading.
          - text: Ein einzelnes Ereignis.
            correct: false
            info: Ein einzelnes Ereignis ist ein Punkt, kein Stück Welle.
          - text: Etwas, das sich jeden Tag wiederholt.
            correct: false
            info: Wiederholungen sind eine Punktreihe. Das ist das simple present.
        explanation: Die Welle steht für etwas, das läuft. Für Zustände wie Wissen oder Besitz passt sie meistens nicht.
        links:
          - title: Lernlandkarte Englisch · Zustandsverben
            url: https://lernapps.net/apps/map/englisch/c/dynamic-stative/
      - type: text
        text: "**Das kannst du danach:** Du erkennst Zustandsverben wie know, like und belong. Und du weißt, dass sie meistens keine Verlaufsform bilden."
  - type: section
    id: lesestueck
    title: Der Dialog nach dem Film
    blocks:
      - type: vocabulary
        caption: Wörter zum Dialog
        languages: { source: de, target: en }
        entries:
          - target: actress
            source: Schauspielerin
          - target: ending
            source: Ende, Schluss
          - target: belong to
            source: gehören (jemandem)
          - target: own
            source: besitzen
          - target: remember
            source: sich erinnern
          - target: prefer
            source: lieber mögen
          - target: to be honest
            source: ehrlich gesagt
          - target: even better
            source: noch besser
          - target: family tree
            source: Stammbaum
      - type: text
        text: |
          **[1]** **Amir:** So, how was the film? I want to hear everything!

          **[2]** **Sophie:** I loved it! I know the actress from another film. She is making a new film right now, I read that online.

          **[3]** **Amir:** I like the ending, but I need to see it again. I am still thinking about it.
      - type: text
        text: |
          **[4]** **Sophie:** Me too. The old castle belongs to the boy's family, you remember? His grandfather owns it.

          **[5]** **Amir:** Yes! I understand now. I believe the old man is his grandfather.

          **[6]** **Sophie:** I prefer the first part, to be honest. At the moment I am reading the book, and it is even better.

          **[7]** **Amir:** You read all the time! I want the book, too. Can I have it when you have finished it?

          **[8]** **Sophie:** Of course! But first tell me your idea about the old man. You always have the best ideas.

          **[9]** **Amir:** I will explain it on the bus tomorrow. I want to draw the family tree, because I need to see all the names in one picture.
  - type: section
    id: neu
    title: Das Stoppschild für die Welle
    blocks:
      - type: text
        text: "Die meisten Verben zeigen eine **Tätigkeit**, und die Welle passt, zum Beispiel I am reading. Manche Verben zeigen aber einen **Zustand**. Wissen, Meinung, Gefühl, Wunsch und Besitz laufen nicht wie eine Tätigkeit. Für sie steht am Zeitstrahl ein **Stoppschild**: keine Welle, keine Verlaufsform."
      - type: figure
        image: images/zeitstrahl-dynamic-stative.svg
        alt: Ein Zeitstrahl von links nach rechts. Rechts steht ein roter Strich mit now. Links läuft eine kurze violette Welle auf ein achteckiges Stoppschild mit dem Wort know zu. Hinter dem Stoppschild geht die Welle nicht weiter.
        caption: Die Welle endet am Stoppschild. Verben wie know bilden keine Welle.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Klassenzimmer-Poster · Verben mit Stoppschild
        header: [Gruppe, Verben, Beispiel]
        rows:
          - [Wissen und Meinung, "know, understand, believe, remember", He understands the rule.]
          - [Gefühl und Wunsch, "like, love, hate, want, need, prefer", I hate spiders.]
          - [Besitz und Zugehörigkeit, "belong, own", The farm belongs to my uncle.]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              **Zustandsverben stehen meistens in der einfachen Form**, auch wenn es um jetzt geht: **I know the answer** ist richtig, **I am knowing the answer** ist falsch. Auch mit since und for steht das present perfect einfach: **She has liked jazz for years**.

              Tätigkeitsverben bilden die Welle, wenn etwas gerade läuft: **I am cooking.** Einige Verben haben zwei Bedeutungen. **think** als „nachdenken“ ist eine Tätigkeit: **I am thinking about it.** Als „meinen, glauben“ ist es ein Zustand: **I think it is good.**
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: dynamic-stative-verstehen
        text: "Woran denkt Amir noch, nach dem Film?"
        options:
          - text: An das Ende des Films.
            correct: true
            info: Amir sagt, dass er noch über das Ende nachdenkt, I am still thinking about it.
          - text: An das Buch, das Sophie liest.
            correct: false
            info: Das Buch möchte Amir später ausleihen. Darüber denkt er nicht nach.
          - text: An die Schauspielerin.
            correct: false
            info: Die Schauspielerin kennt Sophie aus einem anderen Film. Amir sagt dazu nichts.
        explanation: Amir denkt noch über das Ende nach. Hier ist think eine Tätigkeit, darum steht die Welle.
        links:
          - title: Stative verb (Wikipedia)
            url: https://en.wikipedia.org/wiki/Stative_verb
      - type: multiple-choice
        id: dynamic-stative-zeilen
        text: "In welchen Zeilen steht ein Verb mit be + -ing, also eine Welle?"
        options:
          - text: Zeile 2
            correct: true
            info: In Zeile 2 steht is making a new film.
          - text: Zeile 3
            correct: true
            info: In Zeile 3 steht am still thinking. Hier ist think eine Tätigkeit, nachdenken.
          - text: Zeile 6
            correct: true
            info: In Zeile 6 steht am reading the book.
          - text: Zeile 4
            correct: false
            info: In Zeile 4 stehen belongs und owns. Beide sind Zustandsverben ohne -ing.
          - text: Zeile 5
            correct: false
            info: In Zeile 5 stehen understand und believe. Beide sind Zustandsverben ohne -ing.
        explanation: Making, thinking (nachdenken) und reading sind Tätigkeiten, dort steht die Welle. Belongs, owns, understand und believe zeigen Zustände.
        links:
          - title: Stative verb (Wikipedia)
            url: https://en.wikipedia.org/wiki/Stative_verb
      - type: language-task
        id: dynamic-stative-wahl
        languages: { source: de, target: en }
        mode: choice
        task: Wähle die richtige Form.
        form: { case: hint, punctuation: ok }
        items:
          - cue: Ich verstehe die Aufgabe.
            target: I [understand] the exercise.
            distractors: [[am understanding, understanding]]
          - cue: Das Handy gehört meiner Mutter.
            target: The phone [belongs] to my mother.
            distractors: [[is belonging, belong]]
          - cue: Wir brauchen mehr Zeit.
            target: We [need] more time.
            distractors: [[are needing, needs]]
          - cue: Ellie telefoniert gerade mit ihrer Großmutter.
            target: Ellie [is calling] her grandmother right now.
            distractors: [[calls, call]]
        hint: Zustand oder Tätigkeit? Nur eine Tätigkeit, die gerade läuft, bekommt be und -ing.
      - type: language-task
        id: dynamic-stative-bilden
        languages: { source: de, target: en }
        task: Schreibe den ganzen Satz in der richtigen Form.
        form: { case: hint, punctuation: ok }
        items:
          - cue: my sister · want · a new phone
            target: My sister wants a new phone.
            mistakes:
              - answer: My sister is wanting a new phone.
                message: Want ist ein Zustandsverb. Es bekommt keine Welle und kein -ing.
              - answer: My sister want a new phone.
                message: My sister ist „sie“. Bei he, she und it fehlt das s.
          - cue: the boys · like · the new teacher
            target: The boys like the new teacher.
            mistakes:
              - answer: The boys are liking the new teacher.
                message: Like zeigt ein Gefühl, keine Tätigkeit. Hier steht die einfache Form.
              - answer: The boys likes the new teacher.
                message: The boys sind mehrere, also they. Dann kommt kein s an das Verb.
          - cue: I · know · his number
            target: I know his number.
            mistakes:
              - answer: I am knowing his number.
                message: Know ist ein Zustandsverb. Es bekommt keine Verlaufsform.
              - answer: I knows his number.
                message: Bei I steht kein s am Verb.
          - cue: they · play · cards · at the moment
            target: They are playing cards at the moment.
            mistakes:
              - answer: They play cards at the moment.
                message: Play ist eine Tätigkeit, und at the moment sagt, dass sie gerade läuft. Dann brauchst du die Welle mit are und -ing.
              - answer: They playing cards at the moment.
                message: Vor playing fehlt are.
        hint: Frag dich, ob das Verb einen Zustand oder eine Tätigkeit zeigt.
      - type: single-choice
        id: dynamic-stative-ausnahme
        text: "Welcher Satz ist richtig?"
        options:
          - text: I am thinking about my holiday.
            correct: true
            info: Hier ist think eine Tätigkeit, nachdenken. Dann ist die Verlaufsform möglich.
          - text: I am knowing my holiday plans.
            correct: false
            info: Know ist ein Zustandsverb. Es heißt I know my holiday plans.
          - text: I am wanting a holiday.
            correct: false
            info: Want ist ein Zustandsverb. Es heißt I want a holiday.
        explanation: Think kann Tätigkeit (nachdenken) oder Meinung sein. Know und want zeigen immer einen Zustand.
        links:
          - title: Stative verb (Wikipedia)
            url: https://en.wikipedia.org/wiki/Stative_verb
      - type: language-task
        id: dynamic-stative-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz steckt ein Fehler. Schreibe den Satz richtig.
        form: { case: hint, punctuation: ok }
        items:
          - cue: My brother is loving this song.
            target: My brother loves this song.
            mistakes:
              - answer: My brother is loving this song.
                message: Noch nicht ganz. Love ist ein Zustandsverb, es braucht kein is und kein -ing.
          - cue: We are believing you.
            target: We believe you.
            mistakes:
              - answer: We are believing you.
                message: Noch nicht ganz. Believe ist ein Zustandsverb, es braucht kein are und kein -ing.
        hint: Prüfe, ob das Verb einen Zustand zeigt. Dann streichst du be und -ing.
      - type: language-task
        id: dynamic-stative-hoeren
        languages: { source: de, target: en }
        task: Hör zu und schreibe, was du hörst.
        form: { case: hint, punctuation: ok }
        items:
          - audio: my-little-brother-wants-a-new-football.mp3
            target: My little brother wants a new football.
          - audio: i-need-a-bigger-bag-for-my-books.mp3
            target: I need a bigger bag for my books.
          - audio: she-believes-every-word-of-the-story.mp3
            target: She believes every word of the story.
  - type: section
    id: anwenden
    title: Selbst sprechen und schreiben
    blocks:
      - type: speaking-task
        id: dynamic-stative-nachsprechen
        language: en
        items:
          - audio: he-likes-cheese-but-he-is-eating-an-apple.mp3
            text: He likes cheese, but he is eating an apple.
          - audio: i-understand-the-rules-but-i-am-still-learning.mp3
            text: I understand the rules, but I am still learning.
          - audio: we-love-the-new-teacher-and-we-are-working-hard.mp3
            text: We love the new teacher, and we are working hard.
        hint: Hör den Satz zuerst. Sprich langsam nach und achte auf die einfache Form bei like, understand und love.
      - type: open-task
        id: dynamic-stative-meinung
        task: "Schreibe vier Sätze über einen Film, ein Buch oder ein Spiel, das du gut kennst. Was magst du, was brauchst oder willst du, und was machst du gerade damit?"
        points:
          - text: Mindestens zwei Sätze mit einem Zustandsverb in der einfachen Form (zum Beispiel like, love, want, need).
            source: /dauer/dynamic-stative/#neu
          - text: Mindestens ein Satz mit einer Tätigkeit in der Verlaufsform (be + -ing).
            source: /dauer/dynamic-stative/#neu
          - text: Ganze Sätze mit Verb und Punkt am Ende.
            kind: form
        solution: |
          I love this game, and I know every level. I want a new controller, but I need to save money. At the moment I am playing the second level with my friend. I think it is the best part.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: Am Wandbild steht jetzt ein Stoppschild an der Welle. Bei den Zustandsverben bleibt die einfache Form. Im nächsten Kapitel schaut Mr Hill auf die Zukunft und auf feste Pläne.
